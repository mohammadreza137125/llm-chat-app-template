<!doctype html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light">
	<title>مشاور پوست Z.SHOP</title>
	<style>
		*{box-sizing:border-box}body{margin:0;background:#f6f1e8;color:#17332c;font-family:Tahoma,Arial,sans-serif;min-height:100dvh;padding:24px}.page{width:min(760px,100%);margin:auto}.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.logo{width:58px;height:58px;border-radius:20px;background:#efd596;color:#034f3f;display:grid;place-items:center;font-size:26px}.brand h1{font-size:22px;margin:0}.brand p{margin:5px 0 0;color:#718078;font-size:13px}.chat{height:min(720px,calc(100dvh - 145px));min-height:520px;background:#fff;border:1px solid #dfe5e0;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(3,79,63,.12)}.messages{flex:1;overflow:auto;background:#fbf8f1;padding:20px}.message{display:flex;margin-bottom:12px}.message.user{justify-content:flex-start}.bubble{max-width:82%;padding:12px 14px;border-radius:18px;line-height:1.9;white-space:pre-wrap;font-size:14px}.assistant .bubble{background:#fff;border:1px solid #e3e7e3;border-top-right-radius:6px}.user .bubble{background:#034f3f;color:#fff;border-top-left-radius:6px}.product{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;margin:0 0 10px;padding:9px;background:#fff;border:1px solid #dfe5e0;border-radius:17px;text-decoration:none;color:#17332c}.product img{width:64px;height:64px;object-fit:cover;border-radius:13px}.product b,.product small{display:block}.product small{color:#034f3f;margin-top:7px}.chips{display:flex;gap:8px;overflow:auto;padding:10px 14px;border-top:1px solid #e3e7e3}.chips button{border:1px solid #d8dfda;background:#fff;color:#034f3f;border-radius:999px;padding:8px 12px;white-space:nowrap;font-family:inherit}.form{display:flex;gap:8px;padding:12px;border-top:1px solid #e3e7e3}.form textarea{flex:1;resize:none;border:1px solid #d8dfda;border-radius:16px;padding:12px;font:16px/1.6 Tahoma;outline:none}.form button{border:0;border-radius:16px;background:#034f3f;color:#fff;padding:0 22px;font-family:inherit;font-weight:700}.note{text-align:center;color:#718078;font-size:10px;margin:8px 0 0}@media(max-width:600px){body{padding:10px}.chat{height:calc(100dvh - 105px);min-height:430px;border-radius:23px}.brand{margin:4px 5px 10px}.logo{width:45px;height:45px;border-radius:15px}.brand h1{font-size:17px}.messages{padding:13px}.bubble{max-width:91%;font-size:13px}}
	</style>
</head>
<body>
	<main class="page">
		<header class="brand"><div class="logo">✦</div><div><h1>مشاور پوست Z.SHOP</h1><p>مشاوره عمومی و معرفی محصولات موجود فروشگاه</p></div></header>
		<section class="chat">
			<div id="chat-messages" class="messages" aria-live="polite"></div>
			<div class="chips">
				<button type="button" data-prompt="پوستم چرب و جوش‌دار است">پوست چرب و جوش‌دار</button>
				<button type="button" data-prompt="برای لک پوستی چه روتینی مناسب است؟">روتین لک</button>
				<button type="button" data-prompt="برای پوست خشک و حساس محصول معرفی کن">خشکی و حساسیت</button>
			</div>
			<form id="chat-form" class="form"><textarea id="user-input" rows="1" maxlength="2200" placeholder="مشکل پوستتان را بنویسید…"></textarea><button id="send-button" type="submit">ارسال</button></form>
		</section>
		<p class="note">این راهنما جایگزین تشخیص و درمان پزشکی نیست.</p>
	</main>
	<script src="chat.js"></script>
</body>
</html>
